name:  "Terraform CI/CD"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read 

jobs: 
  terraform: 
    name: "Terraform_VPC"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: /app/terraform

    steps:
    # 1. Checkout the repository code
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: ap-south-1


 # 3. Setup Terraform CLI on the runner
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.7.0" #

    # 4. Initialize Terraform (Downloads providers/modules)
    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init


    # 5. Check formatting rules
    - name: Terraform Format
      working-directory: ./terraform
      run: terraform fmt -check

    # 6. Generate speculative deployment plan (Runs on PRs and Pushes)
    - name: Terraform Plan
      run: terraform plan -input=false

    # 7. Apply the changes automatically (ONLY runs when merged into the main branch)
    - name: Terraform Apply
      working-directory: ./terraform
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false